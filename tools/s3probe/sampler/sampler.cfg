MEMORY {
    ZP:   start = $00F0, size = $0010, type = rw;
    LOAD: start = $07FF, size = $0002, file = %O;
    RAM:  start = $0801, size = $06F0, file = %O;
    BUF:  start = $0F00, size = $0100, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADADDR: load = LOAD, type = ro;
    STARTUP:  load = RAM,  type = ro;
    CODE:     load = RAM,  type = rw;
    BSS:      load = BUF,  type = bss;
}
