# tests/stub/stub.cfg — private ld65 config for the tests/stub builds ONLY.
# The real runner PRG is linked with runtime/c64.cfg (owned by the core agent);
# this config exists so runner.s + stub_core.s and smoke.s can be built and
# run before runtime/core.s lands. Segment names match what runner.s expects
# from runtime/c64.cfg: STARTUP first at $0801, then CODE/RODATA/DATA/BSS.

MEMORY {
    LOAD: file = %O, start = $07FF, size = $0002;
    MAIN: file = %O, start = $0801, size = $77FF, type = rw;
    GRAM: file = "", start = $8000, size = $1000, type = rw;
}

SEGMENTS {
    LOADADDR: load = LOAD, type = ro;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro,  optional = yes;
    DATA:     load = MAIN, type = rw,  optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes;
    GUESTRAM: load = GRAM, type = bss, optional = yes;
}
