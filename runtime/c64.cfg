# runtime/c64.cfg — ld65 config for the Amiga64 runner PRG.  Owner: core agent.
#
# Produces a standard C64 PRG: 2-byte load address ($0801), BASIC SYS stub
# (STARTUP segment in core.s), then code/tables up to $9FFF.
#
# Fixed buffers buf_case ($C000) / buf_result ($C800) are reserved as
# dedicated memory areas with optional bss-type segments "CASEBUF"/"RESBUF";
# core.s also exports the labels buf_case/buf_result as absolute constants,
# so consumers may either use the labels or place data via the segments.
#
# The DISPATCH segment (generated build/gen/dispatch.s) is page-aligned so
# the two 256-byte dispatch tables never cross a page (keeps lda abs,x at
# 4 cycles on the hot path).  CODE is page-aligned too: core.s places
# HOTALIGN fills relative to the CODE start so the BRNC-guarded hot branches
# never cross a page (docs/PERF.md (f)).
#
# BHI / BCODE (Wave 11, supervisor-approved; first user W11-B blt.s): banked
# code at $A000-$B5FF, RAM under BASIC ROM.  MAIN is filled to its end
# ($9FFF) so the PRG stays one contiguous load and BCODE lands at $A000.
# BCODE runs ONLY with BASIC ROM banked out: it is entered through a MAIN
# stub that banks BASIC out and restores the caller's $01 on every exit
# (docs/CONTRACTS.md "Blitter (S3.6)").  Shared segment: rc ram.inc region
# "core $A000-$B5FF".  BBSS (banked BSS, optional) follows BCODE in BHI; it
# is NOT cleared by the boot BSS clear (that covers BSS in MAIN only).
#
# Wave 13 (supervisor): RODATA is page-aligned. Its abs,X tables (g5_flow
# f4_evtab/f4_spec, the g3/g4 tables, hle_tab) then keep their page offsets
# whatever CODE grows by, so perf_cycles cannot move with CODE size
# (rev-inp, 2026-10-09: f4_evtab_lo straddled at +207 B CODE, +1/3 cycle).
#
# Wave 12 split of $A000-$B5FF (supervisor; docs/WAVE12_BRIEF.md "Memory
# budget"): BHI $A000-$A7FF (BCODE/BBSS, blt.s), CWIN $A800-$B0FF (W12-C code
# windows, bss), SNAPHI $B100-$B5FF (W12-T SCODE/SBSS).  The PRG is one
# contiguous load, so BHI and CWIN are filled to their ends: SNAPHI's code
# then lands at $B100, and CWIN loads as zeros (the windows are invalid until
# the first fetch).  Still one rc region, "core $A000-$B5FF" (ram.inc).
# W12-C: CWCODE (the cache's banked code, core.s) opens CWIN at $A800; the
# windows (cwin_base, rc ram.inc) start at the next page, the page-low map
# is $B000 (asserted in core.s).

MEMORY {
    ZP:       file = "", start = $0080, size = $0079, define = yes;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $97FF, define = yes, fill = yes;
    BHI:      file = %O, start = $A000, size = $0800, define = yes, fill = yes;
    CWIN:     file = %O, start = $A800, size = $0900, define = yes, fill = yes;
    SNAPHI:   file = %O, start = $B100, size = $0500, define = yes;
    CASEBUF:  file = "", start = $C000, size = $0800, define = yes;
    RESBUF:   file = "", start = $C800, size = $0800, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = MAIN,     type = ro;
    DISPATCH: load = MAIN,     type = ro,  align = $100, optional = yes;
    CODE:     load = MAIN,     type = ro,  align = $100;
    RODATA:   load = MAIN,     type = ro,  align = $100;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define = yes, align = $100;
    BCODE:    load = BHI,      type = ro,  optional = yes;
    BBSS:     load = BHI,      type = bss, optional = yes, define = yes;
    CWCODE:   load = CWIN,     type = ro,  optional = yes, define = yes;
    CWIN:     load = CWIN,     type = bss, optional = yes, define = yes;
    SCODE:    load = SNAPHI,   type = ro,  optional = yes;
    SBSS:     load = SNAPHI,   type = bss, optional = yes, define = yes;
    CASEBUF:  load = CASEBUF,  type = bss, optional = yes, define = yes;
    RESBUF:   load = RESBUF,   type = bss, optional = yes, define = yes;
    ZEROPAGE: load = ZP,       type = zp,  optional = yes;
}
